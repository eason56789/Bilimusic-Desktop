<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BiliMusic">
  <title>BiliMusic Desktop</title>

  <!-- ===== 扁平风格:纯色块 + 简洁几何,无渐变 / 无阴影 / 无描边 ===== -->

  <!-- 底板 -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="#00A1D6"/>

  <!-- 唱片 -->
  <circle cx="242" cy="256" r="130" fill="#0B2E44"/>

  <!-- 音符:视觉重心落在盘面中心,略上移 -->
  <g fill="#FFFFFF">
    <!-- 符干 -->
    <rect x="250" y="166" width="28" height="160" rx="4"/>

    <!-- 符尾 -->
    <path d="M 278 166
             C 310 172 334 192 344 219
             C 352 242 349 264 338 279
             C 332 288 323 295 314 300
             C 321 286 324 271 322 256
             C 319 232 307 211 289 199
             C 284 196 280 194 278 193 Z"/>

    <!-- 符头 -->
    <ellipse cx="222" cy="326" rx="45" ry="35" transform="rotate(-18 222 326)"/>
  </g>

  <!-- 声波:加粗以便小尺寸可见 -->
  <g fill="none" stroke="#0A5F82" stroke-linecap="round">
    <path d="M 390 240 A 30 30 0 0 1 394 276" stroke-width="13"/>
    <path d="M 418 231 A 56 56 0 0 1 423 284" stroke-width="13" opacity="0.55"/>
  </g>
</svg>
